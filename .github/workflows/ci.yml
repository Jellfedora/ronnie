# Builds and tests every push on the three platforms Ronnie ships for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2

      # Some tests use Unix APIs; Windows only checks that Ronnie builds.
      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test --locked

      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --locked
