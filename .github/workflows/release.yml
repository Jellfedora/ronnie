# Pushing a vX.Y.Z tag (scripts/release.sh) builds Ronnie for macOS, Linux and Windows, then publishes
# a GitHub release with the archives. The release is only created once every build has succeeded, so
# the in-app updater never sees a release missing its platform's archive.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job may write (create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # The newest image: the app still runs from macOS 11 (LSMinimumSystemVersion).
          - os: macos-latest
          # Oldest supported runner: the binary then works on older glibc versions too.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but Cargo.toml says $version" >&2
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev libasound2-dev


      - name: Tests
        run: cargo test --locked

      # Ronnie's self-signed certificate (MACOS_SIGN_P12, base64, and its password) in a keychain of
      # its own; without the secrets, package.sh signs ad-hoc.
      - name: macOS signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No MACOS_SIGN_P12 secret: ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode >"$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          echo "RONNIE_SIGN_IDENTITY=Ronnie Code Signing" >>"$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ronnie-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src

      # The release notes are this version's section of CHANGELOG.md (commit list if it has none).
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' src/CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "notes=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "notes=--generate-notes" >> "$GITHUB_ENV"; fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Ronnie ${GITHUB_REF_NAME#v}" $notes
