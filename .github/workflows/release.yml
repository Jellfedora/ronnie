# Pushing a vX.Y.Z tag (scripts/release.sh) builds Ronnie for macOS, Linux and Windows, then publishes
# a GitHub release with the archives. The release is only created once every build has succeeded, so
# the in-app updater never sees a release missing its platform's archive.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
          # Oldest supported runner: the binary then works on older glibc versions too.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but Cargo.toml says $version" >&2
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test --locked

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ronnie-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src

      # The release notes are this version's section of CHANGELOG.md (commit list if it has none).
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' src/CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "notes=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "notes=--generate-notes" >> "$GITHUB_ENV"; fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Ronnie ${GITHUB_REF_NAME#v}" $notes
