[package]
name = "ronnie"
version = "0.4.0"
edition = "2024"
description = "Terminal Power Métal"
repository = "https://github.com/Jellfedora/ronnie"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
arboard = "3.6"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.36"
flate2 = "1.1.10"
portable-pty = "0.9"
rfd = "0.17"
russh-sftp = "3"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "fs", "time", "macros"] }
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20.0", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSNull", "NSString"] }
raw-window-handle = "0.6"

[target."cfg(windows)".dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds usable: optimize dependencies (the terminal parser and renderer are hot paths).
[profile.dev.package."*"]
opt-level = 2
